[project]
name = "cspm-scan"
version = "0.1.0"
description = "Local read-only AWS CSPM scanner"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-mock>=3.12"]

[project.scripts]
cspm-scan = "cspm_scan.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cspm_scan*"]
